<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>multicam scene</title>
    <style>
      html,body { margin: 0; background: #000; overflow: hidden; }
      #c { display: block; }
    </style>
    <script type="importmap">
      { "imports": { "three": "https://esm.sh/three@0.180.0" } }
    </script>
  </head>
  <body>
    <canvas id="c"></canvas>
    <script type="module">
      import * as THREE from "three";

      // ---- Ground plane footprint (metres). Lot is centred on the origin on
      // the XZ plane (y up). World-normalised coords (gx,gy)∈[0,1]² map to
      // X=(gx-0.5)*W, Z=(gy-0.5)*D. The homography is derived from this exact
      // mapping so the dragged ground point lands where the render shows it.
      const W = 32, D = 18;
      const worldFromNorm = (gx, gy) => [ (gx - 0.5) * W, 0, (gy - 0.5) * D ];
      // Asphalt extends well beyond the lot so any framing/aspect shows tarmac
      // (never the sky background) around the markings — full-bleed friendly.
      const GW = 90, GD = 56;

      const renderer = new THREE.WebGLRenderer({
        canvas: document.getElementById("c"),
        antialias: true,
        preserveDrawingBuffer: true, // needed for toDataURL after render
      });
      renderer.setPixelRatio(1);
      renderer.shadowMap.enabled = true;
      renderer.shadowMap.type = THREE.PCFSoftShadowMap;
      renderer.outputColorSpace = THREE.SRGBColorSpace;
      renderer.toneMapping = THREE.ACESFilmicToneMapping;
      renderer.toneMappingExposure = 1.05;

      const scene = new THREE.Scene();

      // ---------- materials we re-theme between day / night ----------
      const asphalt = new THREE.MeshStandardMaterial({ color: 0x6b7076, roughness: 0.95, metalness: 0.0 });
      const lineMat = new THREE.MeshStandardMaterial({ color: 0xf0efe9, roughness: 0.8, emissive: 0x000000 });
      const lampEmissive = new THREE.MeshStandardMaterial({ color: 0x222222, emissive: 0xffd9a0, emissiveIntensity: 0.0 });

      // ---------- ground ----------
      const ground = new THREE.Mesh(new THREE.PlaneGeometry(GW, GD), asphalt);
      ground.rotation.x = -Math.PI / 2;
      ground.receiveShadow = true;
      scene.add(ground);

      // ---------- parking bay markings (thin flat boxes, perfectly aligned) ----------
      const margin = 1.5, bayW = 2.5, nbays = 11;
      const rowWidth = nbays * bayW, startX = -rowWidth / 2;
      const topZ0 = -8, topZ1 = -3, botZ0 = 3, botZ1 = 8; // bay depth 5, aisle 6
      const line = (w, l, x, z) => {
        const m = new THREE.Mesh(new THREE.BoxGeometry(w, 0.02, l), lineMat);
        m.position.set(x, 0.012, z);
        scene.add(m);
      };
      // bay dividers (along Z) for both rows
      for (let i = 0; i <= nbays; i++) {
        const x = startX + i * bayW;
        line(0.12, topZ1 - topZ0, x, (topZ0 + topZ1) / 2);
        line(0.12, botZ1 - botZ0, x, (botZ0 + botZ1) / 2);
      }
      // front (aisle-facing) lines
      line(rowWidth, 0.12, 0, topZ1);
      line(rowWidth, 0.12, 0, botZ0);
      // aisle centre dashes
      for (let x = -rowWidth / 2 + 1; x < rowWidth / 2; x += 3) line(1.4, 0.1, x, 0);

      // ---------- cars (fixed positions so the render is reproducible) ----------
      const carPalette = [0x9aa3ab, 0xb4332f, 0x2f5fa8, 0xded7c8, 0x394149, 0x3d7a55, 0xc9883a];
      const carMeshes = [];
      function addCar(bayIndex, row, colorIdx) {
        const x = startX + (bayIndex + 0.5) * bayW;
        const z = row === "top" ? (topZ0 + topZ1) / 2 : (botZ0 + botZ1) / 2;
        const g = new THREE.Group();
        const bodyMat = new THREE.MeshStandardMaterial({ color: carPalette[colorIdx % carPalette.length], roughness: 0.45, metalness: 0.25 });
        const body = new THREE.Mesh(new THREE.BoxGeometry(1.85, 0.95, 4.2), bodyMat);
        body.position.y = 0.62; body.castShadow = true; g.add(body);
        const cabin = new THREE.Mesh(new THREE.BoxGeometry(1.7, 0.72, 2.1), new THREE.MeshStandardMaterial({ color: 0x10141a, roughness: 0.25, metalness: 0.4 }));
        cabin.position.set(0, 1.28, row === "top" ? -0.25 : 0.25); cabin.castShadow = true; g.add(cabin);
        g.position.set(x, 0, z);
        scene.add(g); carMeshes.push(g);
      }
      addCar(1, "top", 0); addCar(3, "top", 1); addCar(4, "top", 4); addCar(7, "top", 2); addCar(9, "top", 5);
      addCar(0, "bot", 3); addCar(2, "bot", 6); addCar(5, "bot", 1); addCar(8, "bot", 0); addCar(10, "bot", 2);

      // ---------- lamp posts (decor + night lights) ----------
      const lampLights = [];
      function addLamp(x, z) {
        const pole = new THREE.Mesh(new THREE.CylinderGeometry(0.09, 0.11, 5, 10), new THREE.MeshStandardMaterial({ color: 0x2a2e33, roughness: 0.7 }));
        pole.position.set(x, 2.5, z); pole.castShadow = true; scene.add(pole);
        const head = new THREE.Mesh(new THREE.BoxGeometry(0.7, 0.18, 0.4), lampEmissive);
        head.position.set(x, 5, z); scene.add(head);
        const pl = new THREE.PointLight(0xffd9a0, 0, 16, 2); pl.position.set(x, 4.9, z); scene.add(pl); lampLights.push(pl);
      }
      addLamp(-rowWidth / 2 - 0.5, 0); addLamp(rowWidth / 2 + 0.5, 0);
      addLamp(-6, -8.6); addLamp(6, 8.6);

      // ---------- lights ----------
      const hemi = new THREE.HemisphereLight(0xdfe7ee, 0x4b4640, 1.0); scene.add(hemi);
      const sun = new THREE.DirectionalLight(0xfff2dd, 2.0);
      sun.position.set(-14, 20, -8); sun.castShadow = true;
      sun.shadow.mapSize.set(2048, 2048);
      const sc = sun.shadow.camera; sc.left = -22; sc.right = 22; sc.top = 16; sc.bottom = -16; sc.near = 1; sc.far = 60;
      scene.add(sun);
      const ambient = new THREE.AmbientLight(0xffffff, 0.15); scene.add(ambient);

      function applyTheme(theme) {
        const day = theme === "day";
        // Night = an evening look (brighter base than pitch-dark) with the lamps
        // clearly carrying the scene.
        scene.background = new THREE.Color(day ? 0xc3cdd6 : 0x1a242e);
        scene.fog = day ? null : new THREE.Fog(0x1a242e, 40, 96);
        asphalt.color.set(day ? 0x6b7076 : 0x3d454e);
        lineMat.color.set(day ? 0xf0efe9 : 0xd2d5d0);
        lineMat.emissive.set(day ? 0x000000 : 0x14110a);
        lineMat.emissiveIntensity = day ? 0 : 0.55;
        hemi.intensity = day ? 1.0 : 0.55;
        hemi.groundColor.set(day ? 0x4b4640 : 0x111922);
        ambient.intensity = day ? 0.15 : 0.16;
        sun.color.set(day ? 0xfff2dd : 0xaec6e6);
        sun.intensity = day ? 2.0 : 0.35;
        lampEmissive.emissiveIntensity = day ? 0.05 : 3.0;
        lampLights.forEach((l) => { l.intensity = day ? 0 : 55; l.distance = day ? 16 : 26; });
      }

      function projectPoint(camera, x, y, z, w, h) {
        const v = new THREE.Vector3(x, y, z).project(camera);
        return [(v.x * 0.5 + 0.5) * w, (1 - (v.y * 0.5 + 0.5)) * h];
      }

      function makeCamera(spec) {
        const { kind, width, height, pos, target, fov, orthoHalfW, orthoHalfH } = spec;
        let camera;
        if (kind === "ortho") {
          camera = new THREE.OrthographicCamera(-orthoHalfW, orthoHalfW, orthoHalfH, -orthoHalfH, 0.1, 200);
          camera.up.set(0, 0, -1);
        } else {
          camera = new THREE.PerspectiveCamera(fov, width / height, 0.1, 400);
        }
        camera.position.set(pos[0], pos[1], pos[2]);
        camera.lookAt(target[0], target[1], target[2]);
        camera.updateMatrixWorld(true);
        camera.updateProjectionMatrix();
        return camera;
      }

      // Project a world-normalised ground point to pixels (ground truth for tests).
      window.__projectNorm = function (spec, gx, gy) {
        const camera = makeCamera(spec);
        const [X, Y, Z] = worldFromNorm(gx, gy);
        return projectPoint(camera, X, Y, Z, spec.width, spec.height);
      };

      // Render one camera/theme and return the image + the 4 ground-corner pixels.
      window.__render = function (spec) {
        const { width, height, theme } = spec;
        renderer.setSize(width, height, false);
        const camera = makeCamera(spec);

        applyTheme(theme);
        renderer.render(scene, camera);

        const corners = [[0, 0], [1, 0], [1, 1], [0, 1]].map(([gx, gy]) => {
          const [X, Y, Z] = worldFromNorm(gx, gy);
          return projectPoint(camera, X, Y, Z, width, height);
        });
        return { dataURL: renderer.domElement.toDataURL("image/jpeg", 0.85), corners };
      };

      window.__ground = { W, D };
      window.__sceneReady = true;
    </script>
  </body>
</html>
