name: Visual regression tests

on:
  push:
    branches:
      - main
      - master
  pull_request:

jobs:
  visual-regression:
    runs-on: ubuntu-latest
    # Run inside the official Playwright image so font rendering / anti-aliasing
    # matches exactly the environment used to generate the committed baselines
    # (see scripts/test-visual-update-linux.js). Must match the playwright version.
    container:
      image: mcr.microsoft.com/playwright:v1.60.0-jammy

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install dependencies
        run: npm ci

      - name: Run visual regression tests
        run: npm run test:visual

      - name: Upload Playwright HTML report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report
